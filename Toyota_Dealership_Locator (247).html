  <style>
    * { box-sizing: border-box; }
    body { font-family: Arial, sans-serif; margin: 0; background: #f4f7f6; }
    .container { max-width: 960px; margin: 30px auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 16px rgba(0,0,0,0.12); }
    h2 { color: #d0011b; margin-top: 0; font-size: 1.6em; border-bottom: 2px solid #d0011b; padding-bottom: 10px; }
    .form-row { display: flex; gap: 10px; align-items: flex-end; margin-bottom: 20px; }
    .form-row input { flex: 1; padding: 12px; border: 1px solid #ccc; border-radius: 5px; font-size: 16px; outline: none; transition: border 0.2s; }
    .form-row input:focus { border-color: #d0011b; }
    .form-row button { background: #d0011b; color: white; border: none; padding: 12px 24px; font-size: 16px; border-radius: 5px; cursor: pointer; font-weight: bold; white-space: nowrap; transition: background 0.2s; }
    .form-row button:hover { background: #a00014; }
    #status { padding: 10px 0; font-size: 15px; min-height: 24px; }
    .status-ok { color: #28a745; }
    .status-err { color: #d0011b; }
    .status-info { color: #555; }
    .results-section { display: none; margin-top: 24px; }
    .results-section h3 { color: #333; font-size: 1.1em; margin-bottom: 12px; }
    .dealer-card { background: #fafafa; border-left: 5px solid #d0011b; padding: 16px 18px; border-radius: 6px; margin-bottom: 14px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
    .dealer-card-header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
    .dealer-card-header h4 { margin: 0; color: #222; font-size: 1.05em; }
    .badge { background: #d0011b; color: white; padding: 4px 12px; border-radius: 20px; font-size: 0.82em; font-weight: bold; }
    .dealer-info p { margin: 5px 0; font-size: 0.94em; color: #444; }
    .dealer-links { margin-top: 10px; display: flex; gap: 14px; flex-wrap: wrap; }
    .dealer-links a { color: #d0011b; text-decoration: none; font-weight: bold; font-size: 0.9em; }
    .dealer-links a:hover { text-decoration: underline; }
    #map { height: 460px; width: 100%; margin-top: 24px; border-radius: 8px; border: 1px solid #ddd; }
    .hint { font-size: 0.85em; color: #888; margin-top: 6px; }
  </style>
</head>
<body>

<div class="container">
  <h2>🚗 Toyota Dealership Locator</h2>

    <div id="resultsContainer"></div>
  </div>

  <div id="map"></div>
</div>

  // ── Map setup ───────────────────────────────────────────────────────────────
  const map = L.map('map').setView([56.1304, -106.3468], 4);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© <a href="https://openstreetmap.org">OpenStreetMap</a> contributors'
  }).addTo(map);
  let markers = [];

  // ── Haversine formula ───────────────────────────────────────────────────────
  function haversineKm(lat1, lon1, lat2, lon2) {
    const R = 6371, r = Math.PI / 180;
    const dLat = (lat2 - lat1) * r;
    const dLon = (lon2 - lon1) * r;
    const a = Math.sin(dLat/2)**2 +
              Math.cos(lat1*r) * Math.cos(lat2*r) * Math.sin(dLon/2)**2;
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
  }

  // ── Geocode postal code ─────────────────────────────────────────────────────
  // Strategy 1: match against our own dataset (exact or FSA prefix)
  // Strategy 2: Nominatim with postalcode= field (not free-text q=)
  // Strategy 3: Zippopotam FSA fallback
  async function geocodePostal(raw) {
    const clean6 = raw.replace(/[^a-zA-Z0-9]/g, '').toUpperCase(); // e.g. "M4M2A5"
    const fsa    = clean6.slice(0, 3);                              // e.g. "M4M"

    // 1. Check our own dataset for an exact or FSA-prefix postal code match
    const dsMatch = DEALERS.find(d => {
      const dp = (d.postalCode || '').replace(/[^a-zA-Z0-9]/g, '').toUpperCase();
      return dp === clean6 || dp.slice(0,3) === fsa;
    });
    if (dsMatch) {
      const lat = parseFloat(dsMatch.latitude), lon = parseFloat(dsMatch.longitude);
      if (!isNaN(lat) && !isNaN(lon)) return { lat, lon };
    }

    // 2. Nominatim with structured postalcode= field (avoids location-bias from q=)
    try {
      const url = `https://nominatim.openstreetmap.org/search?format=json&postalcode=${encodeURIComponent(clean6)}&countrycodes=ca&limit=1`;
      const res  = await fetch(url, { headers: { 'Accept-Language': 'en' } });
      const data = await res.json();
      if (data.length > 0) return { lat: +data[0].lat, lon: +data[0].lon };
    } catch(e) { console.warn('Nominatim structured lookup failed:', e); }

    // 3. Zippopotam FSA fallback
    try {
      const res = await fetch(`https://api.zippopotam.us/ca/${fsa}`);
      if (res.ok) {
        const d = await res.json();
        if (d.places?.length > 0) return { lat: +d.places[0].latitude, lon: +d.places[0].longitude };
      }
    } catch(e) { console.warn('Zippopotam failed:', e); }

    throw new Error(`Could not locate postal code "${raw}" in Canada. Please check and try again.`);
  }

  // ── Main search ─────────────────────────────────────────────────────────────
  async function findNearest() {
    const input = document.getElementById('postalCode').value.trim();
    if (!input) { alert('Please enter a postal code.'); return; }

    setStatus('info', '🔍 Looking up postal code coordinates...');

    let coords;
    try {
      coords = await geocodePostal(input);
    } catch(e) {
      setStatus('err', '❌ ' + e.message);
      return;
    }

    setStatus('info', '📐 Calculating distances to all dealerships...');

    // Rank all dealers by distance
    const ranked = DEALERS
      .map(d => {
        const lat = parseFloat(d.latitude), lon = parseFloat(d.longitude);
        if (isNaN(lat) || isNaN(lon)) return null;
        return { ...d, _dist: haversineKm(coords.lat, coords.lon, lat, lon) };
      })
      .filter(Boolean)
      .sort((a, b) => a._dist - b._dist);

    if (!ranked.length) {
      setStatus('err', '❌ No dealerships with valid coordinates found.');
      return;
    }

    const top3 = ranked.slice(0, 3);
    renderCards(top3);
    renderMap(coords, input, top3);
    setStatus('ok', `✅ Showing 3 nearest dealerships to ${input.toUpperCase()}`);
  }

  // ── Render dealer cards ─────────────────────────────────────────────────────
  function renderCards(dealers) {
    const section = document.getElementById('resultsSection');
    const container = document.getElementById('resultsContainer');
    container.innerHTML = '';
    section.style.display = 'block';

    dealers.forEach((d, i) => {
      const km = d._dist.toFixed(1);
      const phone = d.telephoneNumber || '';
      const toll  = d.tollFreeNumber  || '';
      const phoneStr = [phone, toll ? `Toll-free: ${toll}` : ''].filter(Boolean).join(' | ');
      const emailStr = d.email ? `<a href="mailto:${d.email}">${d.email}</a>` : '';

      container.insertAdjacentHTML('beforeend', `
        <div class="dealer-card">
          <div class="dealer-card-header">
            <h4>#${i+1} &nbsp;${d.name}</h4>
            <span class="badge">📍 ${km} km away</span>
          </div>
          <div class="dealer-info">
            <p>🏢 <strong>Code:</strong> ${d.dealerCode}</p>
            <p>📍 <strong>Address:</strong> ${d.address}, ${d.city}, ${d.province} ${d.postalCode}</p>
            ${phoneStr ? `<p>📞 <strong>Phone:</strong> ${phoneStr}</p>` : ''}
            ${emailStr ? `<p>✉️ <strong>Email:</strong> ${emailStr}</p>` : ''}
            ${d.schedule ? `<p>🕐 <strong>Hours:</strong> ${d.schedule}</p>` : ''}
          </div>
          <div class="dealer-links">
            ${d.website            ? `<a href="${d.website}" target="_blank">🌐 Website</a>` : ''}
            ${d.bookOnDealerSiteCta? `<a href="${d.bookOnDealerSiteCta}" target="_blank">📅 Book Service</a>` : ''}
          </div>
        </div>
      `);
    });
  }

  // ── Render map markers ──────────────────────────────────────────────────────
  function renderMap(userCoords, label, dealers) {
    markers.forEach(m => map.removeLayer(m));
    markers = [];

    const bounds = L.latLngBounds();

    // User pin
    const userIcon = L.divIcon({ className: '', html: '📌', iconSize: [24,24], iconAnchor:[12,24] });
    const uPin = L.marker([userCoords.lat, userCoords.lon], { icon: userIcon })
      .addTo(map)
      .bindPopup(`<b>Your location</b><br>${label.toUpperCase()}`)
      .openPopup();
    markers.push(uPin);
    bounds.extend([userCoords.lat, userCoords.lon]);

    // Dealer pins
    dealers.forEach((d, i) => {
      const lat = parseFloat(d.latitude), lon = parseFloat(d.longitude);
      const icon = L.divIcon({ className: '', html: `<div style="background:#d0011b;color:white;border-radius:50%;width:28px;height:28px;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:14px;border:2px solid white;box-shadow:0 2px 6px rgba(0,0,0,0.4)">${i+1}</div>`, iconSize:[28,28], iconAnchor:[14,14] });
      const pin = L.marker([lat, lon], { icon })
        .addTo(map)
        .bindPopup(`<b>#${i+1} ${d.name}</b><br>${d._dist.toFixed(1)} km away<br>${d.address}, ${d.city}`);
      markers.push(pin);
      bounds.extend([lat, lon]);
    });

    map.fitBounds(bounds, { padding: [60, 60] });
  }

  // ── Status helper ───────────────────────────────────────────────────────────
  function setStatus(type, msg) {
    const el = document.getElementById('status');
    el.className = type === 'ok' ? 'status-ok' : type === 'err' ? 'status-err' : 'status-info';
    el.textContent = msg;
  }
</script>
